name: CI & Boundary Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint & Security Boundary Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true

      - name: Set up Python
        # Must satisfy pyproject requires-python >=3.12 / uv.lock requires-python.
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Linting (Ruff)
        run: uv run ruff check .

      - name: Camera Boundary Enforcement Test
        run: uv run python scripts/check-camera-boundaries.py

      - name: Test Suite
        run: uv run pytest -v
